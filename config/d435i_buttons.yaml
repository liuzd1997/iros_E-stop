# Fixed camera, red caps with yellow surrounds, locally planar panel.
color_topic: /camera/camera/color/image_raw
depth_topic: /camera/camera/aligned_depth_to_color/image_raw
camera_info_topic: /camera/camera/color/camera_info
stable_frames: 5
detector:
  min_area: 80
  min_circularity: 0.60
  min_yellow_fraction: 0.12
  min_diameter: 0.035
  max_diameter: 0.070
  min_depth: 0.20
  max_depth: 1.20
  plane_threshold: 0.003
  min_plane_inliers: 0.70
  max_cap_spread: 0.003
